replicaCount: 1

image:
  repository: burritoworks/catering
  tag: 0.9.7
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

env:
  SERVICE_NAME: catering
  LOG_LEVEL: info

# NOTE: copied from the order-ahead chart in 2024 and edited by hand.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 192Mi

probes:
  liveness:
    enabled: true
    path: /healthz
  readiness:
    enabled: true
    path: /readyz

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
