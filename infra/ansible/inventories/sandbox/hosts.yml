---
# Local demo sandbox: the three SSH-enabled containers from
# infra/targets/docker-compose.yml, standing in for store edge hosts.
all:
  children:
    store_kitchen_hosts:
      hosts:
        sandbox-store100-kds:
          ansible_host: 127.0.0.1
          ansible_port: 2201
          site_id: '100'
          market: san-diego
          region: west
        sandbox-store201-kds:
          ansible_host: 127.0.0.1
          ansible_port: 2202
          site_id: '201'
          market: dallas
          region: central
    store_pos_gateways:
      hosts:
        sandbox-store301-pos:
          ansible_host: 127.0.0.1
          ansible_port: 2203
          site_id: '301'
          market: atlanta
          region: east
  vars:
    ansible_user: bwops
    ansible_ssh_pass: bwops
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_password: bwops
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
