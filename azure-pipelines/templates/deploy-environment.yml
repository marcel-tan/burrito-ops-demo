# One environment's worth of deployment: terraform apply behind an approval,
# then a Helm upgrade of both services, then the Ansible store fleet run.
parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string
  - name: namespace
    type: string
  - name: dependsOn
    type: string
    default: ''

stages:
  - stage: deploy_${{ parameters.environment }}
    displayName: Deploy ${{ parameters.environment }}
    ${{ if ne(parameters.dependsOn, '') }}:
      dependsOn: ${{ parameters.dependsOn }}
    jobs:
      - deployment: infrastructure
        displayName: Terraform apply
        environment: burritoworks-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(TERRAFORM_VERSION)
                - task: TerraformTaskV4@4
                  displayName: terraform init
                  inputs:
                    provider: azurerm
                    command: init
                    workingDirectory: infra/terraform/envs/${{ parameters.environment }}
                    backendServiceArm: ${{ parameters.serviceConnection }}
                    backendAzureRmResourceGroupName: rg-burritoworks-tfstate
                    backendAzureRmStorageAccountName: stbwplatformtfstate
                    backendAzureRmContainerName: tfstate
                    backendAzureRmKey: ${{ parameters.environment }}.tfstate
                - task: TerraformTaskV4@4
                  displayName: terraform apply
                  inputs:
                    provider: azurerm
                    command: apply
                    workingDirectory: infra/terraform/envs/${{ parameters.environment }}
                    environmentServiceNameAzureRM: ${{ parameters.serviceConnection }}
                    commandOptions: -var-file=${{ parameters.environment }}.tfvars -auto-approve

      - deployment: services
        displayName: Helm upgrade
        dependsOn: infrastructure
        environment: burritoworks-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: HelmInstaller@1
                  inputs:
                    helmVersionToInstall: $(HELM_VERSION)
                - task: AzureCLI@2
                  displayName: Get AKS credentials
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group rg-burritoworks-platform-${{ parameters.environment }} \
                        --name aks-${{ parameters.environment }}-eastus2 --overwrite-existing
                - script: |
                    set -e
                    for chart in order-ahead catering; do
                      helm upgrade --install "$chart" "infra/helm/charts/$chart" \
                        -n ${{ parameters.namespace }} --create-namespace \
                        -f "infra/helm/values/${{ parameters.environment }}/$chart.yaml" \
                        --set image.tag=$(IMAGE_TAG) --wait --atomic --timeout 10m
                    done
                  displayName: helm upgrade

      - deployment: store_fleet
        displayName: Ansible store fleet
        dependsOn: services
        condition: and(succeeded(), eq('${{ parameters.environment }}', 'prod'))
        environment: burritoworks-stores
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: '3.12'
                - script: pip install ansible-core
                  displayName: Install Ansible
                - script: |
                    ansible-playbook -i inventories/stores/hosts.yml playbooks/site.yml \
                      --limit store_edge_routers --forks 25
                  workingDirectory: infra/ansible
                  displayName: ansible-playbook site.yml
